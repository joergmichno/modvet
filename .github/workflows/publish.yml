name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish to PyPI (Trusted Publishing, kein Token)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/modvet
    permissions:
      id-token: write  # OIDC für Trusted Publishing — kein API-Token nötig
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel + sdist
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
