[project]
name = "modvet"
version = "0.2.8"
authors = [{ name = "Joerg Michno" }]
description = "ModVet — deterministic pre-install security scanner for Claude Code mods (and later: skills, MCP servers)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
modvet = "modvet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modvet"]

[tool.hatch.build.targets.sdist]
exclude = ["/benchmark", "/dist", "/work-*.json", "/work-*.txt", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["benchmark", "demo-mods", "dist", "tools", "specs", "docs"]
