[project]
name = "modvet"
version = "0.1.0"
description = "ModVet — deterministic pre-install security scanner for Claude Code mods (and later: skills, MCP servers)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
modvet = "modvet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modvet"]
